<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 標準的なビューポート設定に戻す -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iPhone・iPad用（ホーム画面追加時） -->
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Android・PC用 -->
  <link rel="icon" href="icon.png" type="image/png">
</head>
<body>

  <main class="container">
    <!-- トップページ：カテゴリ選択 -->
    <div id="screen-top" class="screen">
      <h1>ベトナム語単語学習</h1>
      <p>学習したい課の範囲を選んでください。<br>正しい日本語訳を4つの選択肢から答えます。</p>
      
      <div class="category-container">
        <button type="button" class="cat-btn" onclick="startQuiz('ch1_5')">第 1 〜 5 課</button>
        <button type="button" class="cat-btn" onclick="startQuiz('ch6_8')">第 6 〜 8 課</button>
        <button type="button" class="cat-btn" onclick="startQuiz('ch9_12')">第 9 〜 12 課</button>
        <button type="button" class="cat-btn" onclick="startQuiz('ch13_15')">第 13 〜 15 課</button>
        <button type="button" class="cat-btn" onclick="startQuiz('ch16_19')">第 16 〜 19 課</button>
        <button type="button" class="cat-btn" onclick="startQuiz('ch20_22')">第 20 〜 22 課</button>
        <button type="button" class="cat-btn" onclick="startQuiz('ch23_25')">第 23 〜 25 課</button>
        <button type="button" class="cat-btn all-btn" onclick="startQuiz('all')">全範囲からランダム</button>
      </div>
    </div>

    <!-- クイズページ（2ページ目以降） -->
    <div id="screen-quiz" class="screen" style="display: none;">
      <div class="progress-info">
        問題 <span id="current-question-num">1</span> / 10
      </div>
      
      <!-- 単語表示エリア（スピーカーボタン付き） -->
      <div class="word-card">
        <div class="word-row">
          <span id="question-word" class="vn-word">ベトナム語</span>
          <button type="button" class="speaker-btn" onclick="playVietnameseAudio()" title="発音を聞く">
            🔊
          </button>
        </div>
      </div>

      <!-- 4択ボタンエリア -->
      <div class="choices-container">
        <button type="button" class="choice-btn" onclick="selectAnswer(0)"></button>
        <button type="button" class="choice-btn" onclick="selectAnswer(1)"></button>
        <button type="button" class="choice-btn" onclick="selectAnswer(2)"></button>
        <button type="button" class="choice-btn" onclick="selectAnswer(3)"></button>
      </div>
      <div id="feedback-message" class="feedback"></div>
    </div>

    <!-- 結果発表ページ -->
    <div id="screen-result" class="screen" style="display: none;">
      <h1>結果発表</h1>
      <div class="result-score">
        正解数： <span id="score-count">0</span> / 10 問
      </div>
      <p id="result-comment"></p>
      <div class="start-area">
        <button type="button" class="btn-primary" onclick="returnToTop()">カテゴリ選択に戻る</button>
      </div>
    </div>
  </main>

  <!-- 画面下部固定ボタンエリア（常設） -->
  <footer class="bottom-bar" id="bottom-nav">
    <button type="button" id="btn-prev" class="nav-btn" onclick="goPrev()">戻る</button>
    <button type="button" id="btn-next" class="nav-btn" onclick="goNext()">次へ</button>
    <button type="button" class="nav-btn btn-exit" onclick="goExit()">終了：ブラウザのタブを閉じる</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
